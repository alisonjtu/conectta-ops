<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTU - Dashboard de Manutenção Real-Time</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF e AutoTable para Exportação em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #070d19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .tab-active {
            background-color: #1e293b;
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
    </style>
</head>
<body class="bg-[#050a15] text-slate-100 font-sans min-h-screen p-4 md:p-6">

    <!-- HEADER / BARRA SUPERIOR -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-slate-800/80">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                🚌 JTU <span class="text-xs px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30 font-semibold">Manutenção Real-Time</span>
            </h1>
            <p class="text-xs text-slate-400 mt-0.5">Sincronização ERP Globus (Oracle) → PostgreSQL Cache (Garagem 2)</p>
        </div>

        <div class="flex items-center gap-3">
            <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="status-text">Conectando...</span>
            </div>

            <button onclick="toggleFullScreen()" class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700/60 transition-all shadow-sm">
                <span>🖥️</span> Modo TV
            </button>
        </div>
    </header>

    <!-- NAVEGAÇÃO POR ABAS -->
    <div class="flex items-center gap-2 mb-6 border-b border-slate-800 text-xs font-semibold">
        <button onclick="switchTab('os')" id="tab-btn-os" class="tab-active px-4 py-2.5 rounded-t-lg transition-all flex items-center gap-2">
            📋 Ordens de Serviço
        </button>
        <button onclick="switchTab('pecas')" id="tab-btn-pecas" class="px-4 py-2.5 text-slate-400 hover:text-slate-200 rounded-t-lg transition-all flex items-center gap-2">
            ⚙️ Peças & Insumos
        </button>
        <button onclick="switchTab('revisoes')" id="tab-btn-revisoes" class="px-4 py-2.5 text-slate-400 hover:text-slate-200 rounded-t-lg transition-all flex items-center gap-2">
            🛠️ Revisões Preventivas
        </button>
    </div>

    <!-- PAINEL DE KPIs EXPANDIDO (5 CARDS) -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow-lg">
            <span id="label-kpi-total" class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Total de OS</span>
            <p id="kpi-total" class="text-3xl font-extrabold text-white mt-1">0</p>
        </div>
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow-lg">
            <span id="label-kpi-abertas" class="text-[11px] font-semibold text-amber-400 uppercase tracking-wider">Em Aberto</span>
            <p id="kpi-abertas" class="text-3xl font-extrabold text-amber-400 mt-1">0</p>
        </div>
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow-lg">
            <span id="label-kpi-fechadas" class="text-[11px] font-semibold text-emerald-400 uppercase tracking-wider">Concluídas</span>
            <p id="kpi-fechadas" class="text-3xl font-extrabold text-emerald-400 mt-1">0</p>
        </div>
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow-lg">
            <span id="label-kpi-taxa" class="text-[11px] font-semibold text-blue-400 uppercase tracking-wider">Taxa Conclusão</span>
            <p id="kpi-taxa" class="text-3xl font-extrabold text-blue-400 mt-1">0%</p>
        </div>
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow-lg col-span-2 md:col-span-1">
            <span id="label-kpi-mttr" class="text-[11px] font-semibold text-purple-400 uppercase tracking-wider">MTTR Médio</span>
            <p id="kpi-mttr" class="text-3xl font-extrabold text-purple-400 mt-1">0h 0m</p>
        </div>
    </div>

    <!-- SEÇÃO DE GRÁFICOS DINÂMICOS -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow-lg">
            <h3 id="title-chart-1" class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-3">Distribuição por Categoria</h3>
            <div class="h-52 flex justify-center items-center">
                <canvas id="chart1"></canvas>
            </div>
        </div>
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow-lg">
            <h3 id="title-chart-2" class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-3">Ordens por Criticidade</h3>
            <div class="h-52 flex justify-center items-center">
                <canvas id="chart2"></canvas>
            </div>
        </div>
    </div>

    <!-- CONTROLES DE FILTRO E BOTÕES DE EXPORTAÇÃO -->
    <div class="flex flex-col md:flex-row gap-3 mb-4 justify-between items-stretch md:items-center">
        <div class="flex flex-col md:flex-row gap-3 flex-1">
            <input type="text" id="search-input" placeholder="Pesquisar por Prefixo, Nº OS, Defeito, Peça..." 
                   class="bg-slate-900 border border-slate-800 text-xs rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500 flex-1 placeholder-slate-500">
            
            <select id="filter-status" class="bg-slate-900 border border-slate-800 text-xs rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500">
                <option value="TODOS">Todos os Status</option>
                <option value="ABERTA">Apenas Abertas</option>
                <option value="FECHADA">Apenas Fechadas</option>
            </select>
        </div>

        <!-- BOTÕES DE EXPORTAÇÃO -->
        <div class="flex items-center gap-2">
            <button onclick="exportToCSV()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white transition-all shadow-sm">
                <span>📊</span> Excel / CSV
            </button>
            <button onclick="exportToPDF()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white transition-all shadow-sm">
                <span>📄</span> PDF
            </button>
        </div>
    </div>

    <!-- TABELA DINÂMICA DE DADOS -->
    <div class="bg-slate-900/90 rounded-xl border border-slate-800 overflow-hidden shadow-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-300">
                <thead id="table-head" class="bg-slate-950 text-slate-400 uppercase tracking-wider text-[10px] border-b border-slate-800">
                    <!-- Gerado dinamicamente via JS conforme a aba ativa -->
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-800/50">
                </tbody>
            </table>
        </div>
    </div>

    <!-- SCRIPT DE INTEGRAÇÃO E LÓGICA DA INTERFACE -->
    <script>
        const API_URL_OS = 'http://192.168.50.101:5678/webhook/os-hoje';
        const API_URL_PECAS = 'http://192.168.50.101:5678/webhook/man-pecas';
        const API_URL_REVISOES = 'http://192.168.50.101:5678/webhook/man-revisoes';

        let activeTab = 'os';
        let rawDataOS = [];
        let rawDataPecas = [];
        let rawDataRevisoes = [];
        let filteredCurrent = [];

        let chart1Instance = null;
        let chart2Instance = null;

        // --- 1. BUSCA DE DADOS NAS APIS DA ETAPA 2 ---
        async function fetchAllData() {
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');

            try {
                const [resOS, resPecas, resRevisoes] = await Promise.allSettled([
                    fetch(API_URL_OS).then(r => r.json()),
                    fetch(API_URL_PECAS).then(r => r.json()),
                    fetch(API_URL_REVISOES).then(r => r.json())
                ]);

                if (resOS.status === 'fulfilled') rawDataOS = Array.isArray(resOS.value) ? resOS.value : [];
                if (resPecas.status === 'fulfilled') rawDataPecas = Array.isArray(resPecas.value) ? resPecas.value : [];
                if (resRevisoes.status === 'fulfilled') rawDataRevisoes = Array.isArray(resRevisoes.value) ? resRevisoes.value : [];

                statusBadge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                statusText.innerText = `Sincronizado às ${new Date().toLocaleTimeString('pt-BR')}`;

                renderDashboard();
            } catch (error) {
                console.error('Erro ao conectar com n8n/PostgreSQL:', error);
                statusBadge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                statusText.innerText = 'A reconectar...';
            }
        }

        // --- 2. TRATAMENTO DE DATAS E HORAS SEM FUSO ---
        function extrairHoraSemFuso(dataString) {
            if (!dataString) return '--:--';
            let parteHora = '';
            if (dataString.includes('T')) parteHora = dataString.split('T')[1];
            else if (dataString.includes(' ')) parteHora = dataString.split(' ')[1];
            else return '--:--';
            return parteHora.substring(0, 5);
        }

        function formatarDataSemFuso(dataString) {
            if (!dataString) return '-';
            const dataPura = dataString.split('T')[0].split(' ')[0];
            const partes = dataPura.split('-');
            if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
            return dataString;
        }

        // --- 3. CÁLCULO DE MTTR (ORDENS DE SERVIÇO) ---
        function calculateMTTR(data) {
            const closedItems = data.filter(i => 
                (i.status === 'FECHADA' || i.status === 'CONCLUIDA' || i.status === 'F') && 
                i.data_abertura && i.data_fechamento
            );

            if (closedItems.length === 0) return '0h 0m';

            let totalMinutes = 0;
            let validCount = 0;

            closedItems.forEach(item => {
                const start = new Date(item.data_abertura);
                const end = new Date(item.data_fechamento);

                if (!isNaN(start) && !isNaN(end) && end >= start) {
                    const diffMs = end - start;
                    totalMinutes += Math.floor(diffMs / (1000 * 60));
                    validCount++;
                }
            });

            if (validCount === 0) return '0h 0m';

            const avgMinutes = Math.round(totalMinutes / validCount);
            const hours = Math.floor(avgMinutes / 60);
            const mins = avgMinutes % 60;

            return `${hours}h ${mins}m`;
        }

        // --- 4. TROCA DE ABAS ---
        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-btn-os').className = tab === 'os' ? 'tab-active px-4 py-2.5 rounded-t-lg transition-all flex items-center gap-2' : 'px-4 py-2.5 text-slate-400 hover:text-slate-200 rounded-t-lg transition-all flex items-center gap-2';
            document.getElementById('tab-btn-pecas').className = tab === 'pecas' ? 'tab-active px-4 py-2.5 rounded-t-lg transition-all flex items-center gap-2' : 'px-4 py-2.5 text-slate-400 hover:text-slate-200 rounded-t-lg transition-all flex items-center gap-2';
            document.getElementById('tab-btn-revisoes').className = tab === 'revisoes' ? 'tab-active px-4 py-2.5 rounded-t-lg transition-all flex items-center gap-2' : 'px-4 py-2.5 text-slate-400 hover:text-slate-200 rounded-t-lg transition-all flex items-center gap-2';
            
            renderDashboard();
        }

        // --- 5. RENDERIZAÇÃO GERAL CONFORME ABA ATIVA ---
        function renderDashboard() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;

            if (activeTab === 'os') {
                renderOS(search, statusFilter);
            } else if (activeTab === 'pecas') {
                renderPecas(search, statusFilter);
            } else if (activeTab === 'revisoes') {
                renderRevisoes(search, statusFilter);
            }
        }

        // --- RENDERIZAR ABA: ORDENS DE SERVIÇO ---
        function renderOS(search, statusFilter) {
            filteredCurrent = rawDataOS.filter(item => {
                const matchesSearch = (item.prefixo || '').toLowerCase().includes(search) ||
                                      (item.numero_os || item.id_os || '').toString().includes(search) ||
                                      (item.defeito_relatado || '').toLowerCase().includes(search);
                const st = (item.status || '').toUpperCase();
                const matchesStatus = statusFilter === 'TODOS' || 
                                      (statusFilter === 'ABERTA' && (st === 'ABERTA' || st === 'A')) ||
                                      (statusFilter === 'FECHADA' && (st === 'FECHADA' || st === 'CONCLUIDA' || st === 'F'));
                return matchesSearch && matchesStatus;
            });

            const total = rawDataOS.length;
            const abertas = rawDataOS.filter(i => (i.status || '').toUpperCase() === 'ABERTA' || i.status === 'A').length;
            const fechadas = rawDataOS.filter(i => (i.status || '').toUpperCase() === 'FECHADA' || i.status === 'CONCLUIDA' || i.status === 'F').length;
            const taxa = total > 0 ? Math.round((fechadas / total) * 100) : 0;
            const mttr = calculateMTTR(rawDataOS);

            document.getElementById('label-kpi-total').innerText = 'TOTAL DE OS';
            document.getElementById('kpi-total').innerText = total;
            document.getElementById('label-kpi-abertas').innerText = 'EM ABERTO';
            document.getElementById('kpi-abertas').innerText = abertas;
            document.getElementById('label-kpi-fechadas').innerText = 'CONCLUÍDAS';
            document.getElementById('kpi-fechadas').innerText = fechadas;
            document.getElementById('label-kpi-taxa').innerText = 'TAXA CONCLUSÃO';
            document.getElementById('kpi-taxa').innerText = `${taxa}%`;
            document.getElementById('label-kpi-mttr').innerText = 'MTTR MÉDIO';
            document.getElementById('kpi-mttr').innerText = mttr;

            document.getElementById('title-chart-1').innerText = 'DISTRIBUIÇÃO POR CATEGORIA';
            document.getElementById('title-chart-2').innerText = 'ORDENS POR CRITICIDADE';

            renderOSTable(filteredCurrent);
            renderOSCharts(rawDataOS);
        }

        function renderOSTable(data) {
            const thead = document.getElementById('table-head');
            thead.innerHTML = `
                <tr>
                    <th class="py-3 px-4">Nº OS</th>
                    <th class="py-3 px-4">Veículo / Prefixo</th>
                    <th class="py-3 px-4">Abertura / Hora</th>
                    <th class="py-3 px-4">Categoria</th>
                    <th class="py-3 px-4">Criticidade</th>
                    <th class="py-3 px-4">Defeito Relatado</th>
                    <th class="py-3 px-4">Status</th>
                </tr>
            `;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-500">Nenhuma Ordem de Serviço encontrada.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                const isCritica = (item.criticidade || '').toLowerCase() === 'alta' && (item.status === 'ABERTA' || item.status === 'A');
                const isMedia = (item.criticidade || '').toLowerCase() === 'média' && (item.status === 'ABERTA' || item.status === 'A');

                if (isCritica) tr.className = "bg-red-950/30 hover:bg-red-900/40 border-l-4 border-red-500 transition-colors";
                else if (isMedia) tr.className = "bg-amber-950/20 hover:bg-amber-900/30 border-l-4 border-amber-500 transition-colors";
                else tr.className = "hover:bg-slate-800/50 transition-colors";

                const isFechada = item.status === 'FECHADA' || item.status === 'CONCLUIDA' || item.status === 'F';
                const statusBadge = !isFechada
                    ? `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">ABERTA</span>`
                    : `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">CONCLUÍDA</span>`;

                const horaFormatada = extrairHoraSemFuso(item.data_abertura);
                const dataFormatada = formatarDataSemFuso(item.data_abertura_formatada || item.data_abertura);

                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono text-slate-200">#${item.numero_os || item.id_os}</td>
                    <td class="py-3 px-4 font-semibold text-white">${item.prefixo || 'N/A'} <span class="text-[10px] text-slate-500 font-normal">(${item.codigo_veiculo || ''})</span></td>
                    <td class="py-3 px-4 text-slate-400">${dataFormatada} <span class="text-blue-400 font-mono text-[11px]">${horaFormatada !== '--:--' ? horaFormatada : ''}</span></td>
                    <td class="py-3 px-4 text-slate-300">${item.categoria || 'Corretiva'}</td>
                    <td class="py-3 px-4 font-semibold ${isCritica ? 'text-red-400 animate-pulse' : 'text-slate-300'}">${item.criticidade || 'Normal'}</td>
                    <td class="py-3 px-4 text-slate-400 max-w-xs truncate">${item.defeito_relatado || 'Sem descrição'}</td>
                    <td class="py-3 px-4">${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderOSCharts(data) {
            const catMap = {};
            const critMap = {};

            data.forEach(i => {
                const cat = i.categoria || 'Mecânica';
                const crit = i.criticidade || 'Média';
                catMap[cat] = (catMap[cat] || 0) + 1;
                critMap[crit] = (critMap[crit] || 0) + 1;
            });

            if (chart1Instance) chart1Instance.destroy();
            if (chart2Instance) chart2Instance.destroy();

            const ctx1 = document.getElementById('chart1').getContext('2d');
            chart1Instance = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10 } } } }
                }
            });

            const ctx2 = document.getElementById('chart2').getContext('2d');
            chart2Instance = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: Object.keys(critMap),
                    datasets: [{
                        label: 'OSs',
                        data: Object.values(critMap),
                        backgroundColor: '#38bdf8',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
                    }
                }
            });
        }

        // --- RENDERIZAR ABA: PEÇAS & INSUMOS ---
        function renderPecas(search, statusFilter) {
            filteredCurrent = rawDataPecas.filter(item => {
                const matchesSearch = (item.descricao_item || '').toLowerCase().includes(search) ||
                                      (item.codigo_item || '').toString().includes(search) ||
                                      (item.prefixo || '').toLowerCase().includes(search) ||
                                      (item.numero_os || '').toString().includes(search);
                return matchesSearch;
            });

            const totalItens = rawDataPecas.reduce((acc, i) => acc + (Number(i.quantidade) || 1), 0);
            const totalValor = rawDataPecas.reduce((acc, i) => acc + (Number(i.valor_total) || 0), 0);
            const totalAtendidos = rawDataPecas.filter(i => (i.status_item || '').toUpperCase() === 'ATENDIDO' || i.status_item === 'A').length;

            document.getElementById('label-kpi-total').innerText = 'TOTAL REQUISITADO';
            document.getElementById('kpi-total').innerText = totalItens;
            document.getElementById('label-kpi-abertas').innerText = 'VALOR TOTAL (R$)';
            document.getElementById('kpi-abertas').innerText = totalValor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('label-kpi-fechadas').innerText = 'ITENS ATENDIDOS';
            document.getElementById('kpi-fechadas').innerText = totalAtendidos;
            document.getElementById('label-kpi-taxa').innerText = '% ATENDIMENTO';
            document.getElementById('kpi-taxa').innerText = rawDataPecas.length > 0 ? `${Math.round((totalAtendidos / rawDataPecas.length) * 100)}%` : '0%';
            document.getElementById('label-kpi-mttr').innerText = 'REGISTROS DE PEÇAS';
            document.getElementById('kpi-mttr').innerText = rawDataPecas.length;

            document.getElementById('title-chart-1').innerText = 'TOP 5 PEÇAS MAIS REQUISITADAS';
            document.getElementById('title-chart-2').innerText = 'STATUS DE ATENDIMENTO DE PEÇAS';

            renderPecasTable(filteredCurrent);
            renderPecasCharts(rawDataPecas);
        }

        function renderPecasTable(data) {
            const thead = document.getElementById('table-head');
            thead.innerHTML = `
                <tr>
                    <th class="py-3 px-4">Nº OS</th>
                    <th class="py-3 px-4">Prefixo</th>
                    <th class="py-3 px-4">Código Item</th>
                    <th class="py-3 px-4">Descrição da Peça</th>
                    <th class="py-3 px-4">Qtd</th>
                    <th class="py-3 px-4">Val. Unitário</th>
                    <th class="py-3 px-4">Val. Total</th>
                    <th class="py-3 px-4">Data Requisição</th>
                </tr>
            `;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="py-8 text-center text-slate-500">Nenhum registro de peça encontrado.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition-colors";
                const vUnit = Number(item.valor_unitario) || 0;
                const vTotal = Number(item.valor_total) || 0;

                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono text-slate-200">#${item.numero_os || item.id_os}</td>
                    <td class="py-3 px-4 font-semibold text-white">${item.prefixo || 'N/A'}</td>
                    <td class="py-3 px-4 text-slate-400 font-mono">${item.codigo_item || '-'}</td>
                    <td class="py-3 px-4 font-semibold text-slate-200">${item.descricao_item || 'Item Geral'}</td>
                    <td class="py-3 px-4 text-blue-400 font-bold">${item.quantidade || 1}</td>
                    <td class="py-3 px-4 text-slate-300">R$ ${vUnit.toFixed(2)}</td>
                    <td class="py-3 px-4 text-emerald-400 font-semibold">R$ ${vTotal.toFixed(2)}</td>
                    <td class="py-3 px-4 text-slate-400">${formatarDataSemFuso(item.data_requisicao)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderPecasCharts(data) {
            const pecasAgg = {};
            data.forEach(i => {
                const desc = i.descricao_item || 'Outros';
                pecasAgg[desc] = (pecasAgg[desc] || 0) + (Number(i.quantidade) || 1);
            });

            const topPecas = Object.entries(pecasAgg)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            if (chart1Instance) chart1Instance.destroy();
            if (chart2Instance) chart2Instance.destroy();

            const ctx1 = document.getElementById('chart1').getContext('2d');
            chart1Instance = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: topPecas.map(p => p[0]),
                    datasets: [{
                        label: 'Quantidade',
                        data: topPecas.map(p => p[1]),
                        backgroundColor: '#3b82f6',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
                        y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { display: false } }
                    }
                }
            });

            const ctx2 = document.getElementById('chart2').getContext('2d');
            chart2Instance = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Atendido', 'Pendente'],
                    datasets: [{
                        data: [
                            data.filter(i => (i.status_item || '').toUpperCase() === 'ATENDIDO' || i.status_item === 'A').length,
                            data.filter(i => (i.status_item || '').toUpperCase() !== 'ATENDIDO' && i.status_item !== 'A').length
                        ],
                        backgroundColor: ['#10b981', '#f59e0b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10 } } } }
                }
            });
        }

        // --- RENDERIZAR ABA: REVISÕES PREVENTIVAS ---
        function renderRevisoes(search, statusFilter) {
            filteredCurrent = rawDataRevisoes.filter(item => {
                const matchesSearch = (item.prefixo || '').toLowerCase().includes(search) ||
                                      (item.codigo_veiculo || '').toString().includes(search) ||
                                      (item.descricao_plano || '').toLowerCase().includes(search);
                return matchesSearch;
            });

            const totalVeiculos = rawDataRevisoes.length;
            const okCount = rawDataRevisoes.filter(i => (i.status_revisao || 'OK').toUpperCase() === 'OK').length;
            const proximaCount = rawDataRevisoes.filter(i => (i.status_revisao || '').toUpperCase() === 'PRÓXIMA' || i.status_revisao === 'PROXIMA').length;
            const vencidaCount = rawDataRevisoes.filter(i => (i.status_revisao || '').toUpperCase() === 'VENCIDA').length;

            document.getElementById('label-kpi-total').innerText = 'FROTA EM MONITORAMENTO';
            document.getElementById('kpi-total').innerText = totalVeiculos;
            document.getElementById('label-kpi-abertas').innerText = 'REVISÕES EM DIA (OK)';
            document.getElementById('kpi-abertas').innerText = okCount;
            document.getElementById('label-kpi-fechadas').innerText = 'PRÓXIMAS DA REVISÃO';
            document.getElementById('kpi-fechadas').innerText = proximaCount;
            document.getElementById('label-kpi-taxa').innerText = 'REVISÕES VENCIDAS';
            document.getElementById('kpi-taxa').innerText = vencidaCount;
            document.getElementById('label-kpi-mttr').innerText = 'DISPONIBILIDADE DA FROTA';
            document.getElementById('kpi-mttr').innerText = totalVeiculos > 0 ? `${Math.round((okCount / totalVeiculos) * 100)}%` : '0%';

            document.getElementById('title-chart-1').innerText = 'STATUS DAS REVISÕES PREVENTIVAS';
            document.getElementById('title-chart-2').innerText = 'DISTRIBUIÇÃO POR PLANO DE REVISÃO';

            renderRevisoesTable(filteredCurrent);
            renderRevisoesCharts(rawDataRevisoes);
        }

        function renderRevisoesTable(data) {
            const thead = document.getElementById('table-head');
            thead.innerHTML = `
                <tr>
                    <th class="py-3 px-4">Código Veículo</th>
                    <th class="py-3 px-4">Prefixo</th>
                    <th class="py-3 px-4">Plano de Revisão</th>
                    <th class="py-3 px-4">KM Atual</th>
                    <th class="py-3 px-4">Próxima Revisão (KM)</th>
                    <th class="py-3 px-4">KM Restante</th>
                    <th class="py-3 px-4">Status</th>
                </tr>
            `;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-500">Nenhum veículo em revisão preventiva encontrado.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                const st = (item.status_revisao || 'OK').toUpperCase();

                if (st === 'VENCIDA') tr.className = "bg-red-950/30 hover:bg-red-900/40 border-l-4 border-red-500 transition-colors";
                else if (st === 'PRÓXIMA' || st === 'PROXIMA') tr.className = "bg-amber-950/20 hover:bg-amber-900/30 border-l-4 border-amber-500 transition-colors";
                else tr.className = "hover:bg-slate-800/50 transition-colors";

                const badge = st === 'VENCIDA' 
                    ? `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-red-500/10 text-red-400 border border-red-500/20">VENCIDA</span>`
                    : (st === 'PRÓXIMA' || st === 'PROXIMA'
                        ? `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">PRÓXIMA</span>`
                        : `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">EM DIA (OK)</span>`);

                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono text-slate-200">#${item.codigo_veiculo}</td>
                    <td class="py-3 px-4 font-semibold text-white">${item.prefixo || 'N/A'}</td>
                    <td class="py-3 px-4 text-slate-300">${item.descricao_plano || item.codigo_plano || 'Revisão Periódica'}</td>
                    <td class="py-3 px-4 text-slate-300 font-mono">${(Number(item.km_atual) || 0).toLocaleString('pt-BR')} KM</td>
                    <td class="py-3 px-4 text-slate-300 font-mono">${(Number(item.km_proxima_revisao) || 0).toLocaleString('pt-BR')} KM</td>
                    <td class="py-3 px-4 font-bold text-blue-400 font-mono">${(Number(item.km_restante) || 0).toLocaleString('pt-BR')} KM</td>
                    <td class="py-3 px-4">${badge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderRevisoesCharts(data) {
            const statusMap = { 'EM DIA (OK)': 0, 'PRÓXIMA': 0, 'VENCIDA': 0 };
            const planoMap = {};

            data.forEach(i => {
                const st = (i.status_revisao || 'OK').toUpperCase();
                if (st === 'VENCIDA') statusMap['VENCIDA']++;
                else if (st === 'PRÓXIMA' || st === 'PROXIMA') statusMap['PRÓXIMA']++;
                else statusMap['EM DIA (OK)']++;

                const plano = i.codigo_plano || 'REV-PADRAO';
                planoMap[plano] = (planoMap[plano] || 0) + 1;
            });

            if (chart1Instance) chart1Instance.destroy();
            if (chart2Instance) chart2Instance.destroy();

            const ctx1 = document.getElementById('chart1').getContext('2d');
            chart1Instance = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusMap),
                    datasets: [{
                        data: Object.values(statusMap),
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10 } } } }
                }
            });

            const ctx2 = document.getElementById('chart2').getContext('2d');
            chart2Instance = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: Object.keys(planoMap),
                    datasets: [{
                        label: 'Veículos',
                        data: Object.values(planoMap),
                        backgroundColor: '#8b5cf6',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
                    }
                }
            });
        }

        // --- EXPORTAÇÃO PARA EXCEL / CSV ---
        function exportToCSV() {
            if (!filteredCurrent || filteredCurrent.length === 0) {
                alert('Nenhum registro filtrado disponível para exportação.');
                return;
            }

            let headers = [];
            let rows = [];

            if (activeTab === 'os') {
                headers = ["Numero_OS", "Prefixo", "Codigo_Veiculo", "Data_Abertura", "Categoria", "Criticidade", "Defeito_Relatado", "Status"];
                rows = filteredCurrent.map(item => [
                    `"${item.numero_os || item.id_os || ''}"`,
                    `"${item.prefixo || ''}"`,
                    `"${item.codigo_veiculo || ''}"`,
                    `"${formatarDataSemFuso(item.data_abertura)} ${extrairHoraSemFuso(item.data_abertura)}"`,
                    `"${item.categoria || ''}"`,
                    `"${item.criticidade || ''}"`,
                    `"${(item.defeito_relatado || '').replace(/"/g, '""')}"`,
                    `"${item.status || ''}"`
                ]);
            } else if (activeTab === 'pecas') {
                headers = ["Numero_OS", "Prefixo", "Codigo_Item", "Descricao_Item", "Quantidade", "Valor_Unitario", "Valor_Total", "Data_Requisicao"];
                rows = filteredCurrent.map(item => [
                    `"${item.numero_os || ''}"`,
                    `"${item.prefixo || ''}"`,
                    `"${item.codigo_item || ''}"`,
                    `"${(item.descricao_item || '').replace(/"/g, '""')}"`,
                    `"${item.quantidade || 1}"`,
                    `"${item.valor_unitario || 0}"`,
                    `"${item.valor_total || 0}"`,
                    `"${formatarDataSemFuso(item.data_requisicao)}"`
                ]);
            } else if (activeTab === 'revisoes') {
                headers = ["Codigo_Veiculo", "Prefixo", "Plano", "KM_Atual", "Proxima_Revisao_KM", "KM_Restante", "Status"];
                rows = filteredCurrent.map(item => [
                    `"${item.codigo_veiculo || ''}"`,
                    `"${item.prefixo || ''}"`,
                    `"${item.codigo_plano || ''}"`,
                    `"${item.km_atual || 0}"`,
                    `"${item.km_proxima_revisao || 0}"`,
                    `"${item.km_restante || 0}"`,
                    `"${item.status_revisao || 'OK'}"`
                ]);
            }

            const csvContent = "\uFEFF" + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `jtu_manutencao_${activeTab}_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        // --- EXPORTAÇÃO PARA PDF ---
        function exportToPDF() {
            if (!filteredCurrent || filteredCurrent.length === 0) {
                alert('Nenhum registro filtrado disponível para exportação.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(14);
            doc.text(`JTU Manutenção - Relatório de ${activeTab.toUpperCase()}`, 14, 15);
            doc.setFontSize(9);
            doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')} | Total Registros: ${filteredCurrent.length}`, 14, 22);

            let tableColumn = [];
            let tableRows = [];

            if (activeTab === 'os') {
                tableColumn = ["Nº OS", "Prefixo", "Abertura", "Categoria", "Criticidade", "Status"];
                tableRows = filteredCurrent.map(item => [
                    item.numero_os || item.id_os,
                    item.prefixo || 'N/A',
                    `${formatarDataSemFuso(item.data_abertura)} ${extrairHoraSemFuso(item.data_abertura)}`,
                    item.categoria || 'Corretiva',
                    item.criticidade || 'Normal',
                    item.status || 'ABERTA'
                ]);
            } else if (activeTab === 'pecas') {
                tableColumn = ["Nº OS", "Prefixo", "Código", "Descrição", "Qtd", "Val. Total"];
                tableRows = filteredCurrent.map(item => [
                    item.numero_os,
                    item.prefixo || 'N/A',
                    item.codigo_item || '-',
                    item.descricao_item || '-',
                    item.quantidade || 1,
                    `R$ ${(Number(item.valor_total) || 0).toFixed(2)}`
                ]);
            } else if (activeTab === 'revisoes') {
                tableColumn = ["Código", "Prefixo", "Plano", "KM Atual", "Próx. Revisão", "Status"];
                tableRows = filteredCurrent.map(item => [
                    item.codigo_veiculo,
                    item.prefixo || 'N/A',
                    item.codigo_plano || 'REV-PADRAO',
                    `${item.km_atual} KM`,
                    `${item.km_proxima_revisao} KM`,
                    item.status_revisao || 'OK'
                ]);
            }

            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: 28,
                theme: 'striped',
                styles: { fontSize: 8 },
                headStyles: { fillColor: [15, 23, 42] }
            });

            doc.save(`jtu_manutencao_${activeTab}_${new Date().toISOString().slice(0,10)}.pdf`);
        }

        // --- MODO TV / FULLSCREEN ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        document.getElementById('search-input').addEventListener('input', renderDashboard);
        document.getElementById('filter-status').addEventListener('change', renderDashboard);

        // Inicialização
        fetchAllData();
        setInterval(fetchAllData, 30000);
    </script>
</body>
